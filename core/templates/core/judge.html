{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Judge | DEXTA</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'core/judge.css' %}">
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <a href="{% url 'home' %}"> <h1 class="logo">DEXTA</h1> </a>
    <nav>
      <ul class="nav-links">
        <li><a href="{% url 'home' %}">Home</a></li>
        <li><a href="{% url 'test_prep' %}">Test Prep</a></li>
        <li><a href="{% url 'judge' %}" class="active">Digital Judge</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Role Play Container -->
  <main class="judge-container">
    <h1 class="judge-title">DECA Role Play Simulator</h1>
    <p class="judge-subtitle">Practice as if in a real competition</p>

    <div class="roleplay-container">
      <div id="chat-box" class="chat-box"></div>
      <textarea id="user-input" placeholder="Type your response..." rows="2"></textarea>
      <div class="chat-buttons">
        <button id="send-btn">Send</button>
        <button id="speak-btn">Speak</button>
        <button id="start-btn">Start Role Play</button>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2025 DEXTA. All Rights Reserved.</p>
  </footer>

  <script>
    const chatBox = document.getElementById("chat-box");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const speakBtn = document.getElementById("speak-btn");
    const startBtn = document.getElementById("start-btn");

    let conversationHistory = [];

    // Text-to-speech function
    function speakText(text) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 1;
        window.speechSynthesis.speak(utterance);
      }
    }

    // Add messages to chat box
    function addMessage(sender, text) {
      const div = document.createElement("div");
      div.className = sender;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Send message to Django roleplay endpoint
    async function sendMessage(message) {
      if (!message) return;

      addMessage("user", message);
      conversationHistory.push({role: "user", content: message});

      try {
        const res = await fetch("{% url 'roleplay_chat' %}", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ message: message, history: conversationHistory })
        });

        const data = await res.json();

        if (data.error) {
          addMessage("ai", "Error: " + data.error);
        } else {
          addMessage("ai", data.reply);
          speakText(data.reply);
          conversationHistory.push({role: "assistant", content: data.reply});
        }
      } catch (err) {
        addMessage("ai", "There was an error processing your request.");
      }
    }

    // Speech-to-text
    speakBtn.addEventListener("click", () => {
      if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
        alert("Your browser does not support speech recognition.");
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.start();
      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        userInput.value = transcript;
        sendMessage(transcript);
      };

      recognition.onerror = (event) => {
        console.error("Speech recognition error:", event.error);
        alert("Error with speech recognition: " + event.error);
      };
    });

    // Start initial scenario manually
    startBtn.addEventListener("click", async () => {
      addMessage("ai", "Generating your DECA Role Play scenario...");
      startBtn.disabled = true;

      try {
        const res = await fetch("{% url 'roleplay_chat' %}", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ message: "Start a new DECA role play scenario for the user.", history: conversationHistory })
        });

        const data = await res.json();

        if (data.error) {
          addMessage("ai", "Error: " + data.error);
        } else {
          addMessage("ai", data.reply);
          speakText(data.reply);
          conversationHistory.push({role: "assistant", content: data.reply});
        }
      } catch (err) {
        addMessage("ai", "There was an error generating the scenario.");
      }
    });

    // Send message via button or Enter
    sendBtn.addEventListener("click", () => {
      const message = userInput.value.trim();
      if (!message) return;
      userInput.value = "";
      sendMessage(message);
    });

    userInput.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        const message = userInput.value.trim();
        if (!message) return;
        userInput.value = "";
        sendMessage(message);
      }
    });
  </script>
</body>
</html>
