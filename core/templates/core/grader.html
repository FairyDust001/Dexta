{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEXTA | AI Grader</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'core/grader.css' %}">

</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <a href="{% url 'home' %}"><h1 class="logo" style="font-size:30px;">DEXTA</h1></a>
    <nav>
      <ul class="nav-links">
        <li class="dropdown"><a href="{% url 'home' %}">Home <span class="arrow">&#9662;</span></a></li>
        <li class="dropdown"><a href="{% url 'test_prep' %}" class="active">Test Prep <span class="arrow">&#9662;</span></a></li>
        <li class="dropdown"><a href="{% url 'grader' %}">Digital Judge <span class="arrow">&#9662;</span></a></li>
        <li class="dropdown"><a href="#">AI Grader <span class="arrow">&#9662;</span></a></li>
        <li><a href="#">Sign In</a></li>
      </ul>
    </nav>
  </header>

  <!-- Loading overlay -->
  <div id="loadingOverlay" class="loading-overlay" style="display:none;">
    <div class="spinner-container">
      <div class="spinner"></div>
      <p>Generating your DECA Written Entry Evaluation...</p>
    </div>
  </div>

  <main>
    <div class="chat-container">
      <h1>DEXTA AI Grader</h1>
      <p>Upload your DECA written entry to begin chatting with the AI grader.</p>

      <!-- Upload Form -->
      <form id="graderForm" enctype="multipart/form-data" class="upload-box">
        <label>Upload Written Entry (PDF)</label>
        <input type="file" id="pdfFile" name="file" accept=".pdf" required>
        <button type="submit" id="submitBtn">Submit for Evaluation</button>
      </form>

      <!-- Feedback/Chat Box -->
      <div id="chatBox" class="chat-box"></div>

      <!-- Chat input -->
      <div class="chat-input-container">
        <input type="text" id="chatInput" class="chat-input" placeholder="Upload your documents first..." disabled>
        <button id="chatSend" class="chat-send-btn" disabled>Send</button>
      </div>

      <!-- Restart Button -->
      <button id="restartBtn" class="chat-send-btn" style="display:none; margin-top:15px;">Restart Evaluation</button>
    </div>
  </main>

  <script>
    const form = document.getElementById("graderForm");
    const submitBtn = document.getElementById("submitBtn");
    const chatBox = document.getElementById("chatBox");
    const chatInput = document.getElementById("chatInput");
    const chatSend = document.getElementById("chatSend");
    const restartBtn = document.getElementById("restartBtn");
    const loadingOverlay = document.getElementById("loadingOverlay");

    let chatHistory = [];
    let initialFeedback = "";

    // Get CSRF token
    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let cookie of cookies) {
          cookie = cookie.trim();
          if (cookie.startsWith(name + '=')) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }
    const csrfToken = getCookie('csrftoken');

    function updateChatBox() {
      const messagesHTML = [];

      if(initialFeedback) {
        messagesHTML.push(`<div class="message ai fade-in"><strong>AI Grader:</strong> ${initialFeedback}</div>`);
      }

      chatHistory.forEach(msg => {
        const roleClass = msg.role === "ai" ? "ai fade-in" : "user fade-in";
        const label = msg.role === "ai" ? "AI Grader" : "You";
        messagesHTML.push(`<div class="message ${roleClass}"><strong>${label}:</strong> ${msg.content}</div>`);
      });

      chatBox.innerHTML = messagesHTML.join("");
      chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: "smooth" });
    }

    async function sendMessage(message) {
      chatHistory.push({role: "user", content: message});
      updateChatBox();

      try {
        const response = await fetch("{% url 'roleplay_chat' %}", {
          method: "POST",
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken
          },
          body: JSON.stringify({message: message, history: chatHistory})
        });
        const data = await response.json();
        if(data.reply) chatHistory.push({role: "ai", content: data.reply});
        else if(data.error) chatHistory.push({role: "ai", content: `❌ Error: ${data.error}`});
        updateChatBox();
      } catch(err) {
        chatHistory.push({role: "ai", content: `❌ Network error: ${err.message}`});
        updateChatBox();
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById("pdfFile");
      if(!fileInput.files.length) { chatHistory.push({role: "ai", content: "❌ No PDF selected."}); updateChatBox(); return; }

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);

      loadingOverlay.style.display = "flex";
      document.body.style.overflow = "hidden";

      try {
        const response = await fetch("{% url 'upload_pdf' %}", {
          method: "POST",
          body: formData,
          headers: {'X-CSRFToken': csrfToken}
        });
        const data = await response.json();

        loadingOverlay.style.display = "none";
        document.body.style.overflow = "auto";

        if(data.feedback) {
          initialFeedback = data.feedback;
          updateChatBox();
          chatInput.disabled = false;
          chatSend.disabled = false;
          chatInput.placeholder = "Ask the AI grader for help...";
          restartBtn.style.display = "block";
          submitBtn.style.display = "none";
        } else if(data.error) {
          chatHistory.push({role: "ai", content: `❌ Failed to grade: ${data.error}`});
          updateChatBox();
        }
      } catch(err) {
        loadingOverlay.style.display = "none";
        document.body.style.overflow = "auto";
        chatHistory.push({role: "ai", content: `❌ Network error: ${err.message}`});
        updateChatBox();
      }
    });

    chatSend.addEventListener("click", () => {
      const message = chatInput.value.trim();
      if(message) { sendMessage(message); chatInput.value = ""; }
    });

    chatInput.addEventListener("keypress", e => { if(e.key === "Enter") chatSend.click(); });

    restartBtn.addEventListener("click", () => {
      chatHistory = [];
      initialFeedback = "";
      updateChatBox();
      chatInput.disabled = true;
      chatSend.disabled = true;
      chatInput.placeholder = "Upload your documents first...";
      document.getElementById("pdfFile").value = "";
      restartBtn.style.display = "none";
      submitBtn.style.display = "inline-block";
    });
  </script>
</body>
</html>
