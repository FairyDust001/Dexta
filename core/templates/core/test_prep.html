{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Prep | DEXTA</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/test_prep.css' %}">
</head>
<body>
<!-- Navbar -->
<header class="navbar">
    <a href="{% url 'home' %}"> <h1 style="font-size: 30px;" class="logo">DEXTA</h1> </a>
    <nav>
        <ul class="nav-links">
            <li class="dropdown">
                <a href="{% url 'home' %}">Home <span class="arrow">&#9662;</span></a>
                <ul class="dropdown-menu">
                    <li><a href="#mission">Our Mission</a></li>
                    <li><a href="#team">The Team</a></li>
                </ul>
            </li>
            <li class="dropdown">
                <a style="color:rgb(73, 72, 72)" class="active">Test Prep</a>
            </li>
            <li class="dropdown">
                <a href="{% url 'judge' %}">Digital Judge</a>
            </li>
            <li class="dropdown">
                <a href="{% url 'grader' %}">AI Grader</a>
            </li>
            <li><a style="color:rgb(73, 72, 72)">Sign In</a></li>
        </ul>
    </nav>
</header>

    <!-- Test Prep Section -->
    <section class="test-prep">
        <h1 class="page-title">Test Prep</h1>

        <div class="test-settings">
            <div class="setting">
                <label for="test-length">Choose Test Length</label>
                <select id="test-length">
                    <option>10 mins</option>
                    <option>20 mins</option>
                    <option>30 mins</option>
                </select>
            </div>

            <div class="setting">
                <label for="timer">Timer</label>
                <select id="timer">
                    <option>On</option>
                    <option>Off</option>
                </select>
            </div>
        </div>

        <button class="start-btn">Start Test</button>

        <div class="question-section">
            <div class="question-header">
                <span>Question 1 of 10</span>
                <span class="timer-display">10:00</span>
            </div>

            <div class="question-box">
                <div class="option">A</div>
                <div class="option">B</div>
                <div class="option">C</div>
                <div class="option">D</div>
            </div>

            <button class="next-btn">Next</button>
        </div>
    </section>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.body.classList.add("fade-in");
        });
    
        // Fade out smoothly when navigating away
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', e => {
                const href = link.getAttribute('href');
                if (href && !href.startsWith('#') && !href.startsWith('javascript')) {
                    e.preventDefault();
                    document.body.classList.remove('fade-in');
                    setTimeout(() => {
                        window.location.href = href;
                    }, 600); // wait for fade-out
                }
            });
        });
    </script>
    
</body>
</html>
